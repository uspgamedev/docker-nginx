
server {
    listen 80;
    charset utf-8;
    server_name forum.usp.game.dev.br;

    location / {
        return 301 https://$host$request_uri;
    }
    include /etc/nginx/shared/letsencrypt.conf;
}

server {
    charset utf-8;
    include /etc/nginx/shared/ssl.conf;

    location = / {
        try_files $uri @website;
    }

    location / {
        root /var/www/static;
        autoindex on;
        try_files $uri
                  $uri/index.html
                  $uri/
                  @website;
    }

    location @website {
        root /var/www/static/website;
        autoindex on;
    }

    location @blog {
        proxy_pass http://blog;
        include /etc/nginx/shared/proxy.conf;
    }

    location /wiki2/ {
        proxy_pass http://bookstack:8080/;
        include /etc/nginx/shared/proxy.conf;
    }

    location /wiki/ {
        proxy_pass http://wiki/wiki/;
        include /etc/nginx/shared/proxy.conf;
    }

    location /chat/ {
        proxy_pass http://chat:8000/;
        include /etc/nginx/shared/proxy.conf;
    }
	
    location /mediawiki/ {
        proxy_pass http://wiki/;
        include /etc/nginx/shared/proxy.conf;
    }

    location /smf {
        return 301 $scheme://forum.usp.game.dev.br/;
    }

    location /forum {
        return 301 $scheme://forum.usp.game.dev.br/;
    }
    
    location /ggj2021 {
    	return 302 https://sites.google.com/ime.usp.br/ggj-usp-2021/;
    }
    
    location /ggj2022 {
    	return 302 https://sites.google.com/usp.br/ggj2022/;
    }

    location /ws {
        proxy_pass http://172.17.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/shared/proxy.conf;
    }

    location /leaderboard {

        # Solve CORS issues (sources: https://enable-cors.org/server_nginx.html https://michielkalkman.com/snippets/nginx-cors-open-configuration/)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            #
            # Custom headers and headers various browsers *should* be OK with but aren't
            #
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            #
            # Tell client that this pre-flight info is valid for 20 days
            #
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'POST') {
           add_header 'Access-Control-Allow-Origin' '*' always;
           add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
           add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
           add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        }
        if ($request_method = 'GET') {
           add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        }

        proxy_pass http://172.17.0.1:8282;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/shared/proxy.conf;

    }

    location /metrics {
        auth_basic           "Metrics";
        auth_basic_user_file /etc/nginx/shared/htpasswd;

        proxy_pass http://node-exporter:9100/metrics;
        include /etc/nginx/shared/proxy.conf;
    }

    include /etc/nginx/shared/letsencrypt.conf;
}

server {
    charset utf-8;
    server_name blog.usp.game.dev.br;

    include /etc/nginx/shared/ssl.conf;

    location / {
        proxy_pass http://blog;
        add_header Access-Control-Allow-Origin *;
        include /etc/nginx/shared/proxy.conf;
    }

    include /etc/nginx/shared/letsencrypt.conf;
}

server {
    charset utf-8;
    server_name forum.usp.game.dev.br;

    include /etc/nginx/shared/ssl.conf;

    location / {
        proxy_pass http://unix:/var/discourse/nginx.http.sock:;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    include /etc/nginx/shared/letsencrypt.conf;
}

server {
    charset utf-8;
    server_name grafana.usp.game.dev.br;

    listen 80;
    # include /etc/nginx/shared/ssl.conf;

    location / {
        proxy_pass http://grafana:3000;
        include /etc/nginx/shared/proxy.conf;
    }

    include /etc/nginx/shared/letsencrypt.conf;
}
